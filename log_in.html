<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Log In</title>
<style>
body{
background-color: rgb(235, 232, 232) ;
font-family: Arial, Helvetica, sans-serif;
margin: 0;
}
.main{
display: flex;
justify-content: center;
padding: 15PX;
align-items: center;
height: 100vh;
gap: 90px;
}

h1{
    font-size: 50px;
    font-family: Arial, Helvetica, sans-serif;
    color: rgb(46, 102, 165);
}
pre{
    font-size: 20px;
    font-family: Arial, Helvetica, sans-serif;
}
*{
    box-sizing: border-box;
}

.box{
    height: auto;
    width: 380px;
    background-color: white;
    border-radius: 8px;
    box-shadow: 5px 5px 10px rgb(136, 135, 135);
    padding: 20px;
    outline-color: gray;
}
.box input{
    width: 100%;
    margin-bottom:13px ;
    padding: 16px;
    border-radius: 5px;
    border: 1px rgb(50, 123, 136);
    outline: none;
    font-size: 15px;
}
.border input:focus{
    border-color: rgb(22, 22, 22);
}
.box-button{
    cursor: pointer;
}
.one{
    height: 30px;
    width: 100%;
    border-radius: 5px;
    background-color: rgb(53, 109, 155);
    color: white;
   border: none;
   cursor: pointer;

}
.two{

    color:rgb(47, 107, 122);
    width: 100%;
    height: 30px;
    border-radius: 5px;
    border: 2px rgb(3, 35, 46);
    cursor: pointer;
}

.three{
    height: 50px;
    width: 60%;
    border-radius: 5px;
    background-color: rgb(8, 97, 8);
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>

    <div class="main">

        <div class="left">

            <h1>
                facebook
            </h1>
           <pre>contact with friend and the world
around you on Facebook</pre>
           </div>
           <div class="box">
            <input type="text"placeholder="Email or phone number">
            <input type="password"placeholder="password">


            <button class="one"><b>Login</b></button>
            <br><br>
            <button class="two"><b>Forgot password?</b></button>
            <br><br>
              <hr>

            <br><br>

                 <center><button class="three"><b>Create new account</b></button></center>

           </div>
        
    </div>

</html>
